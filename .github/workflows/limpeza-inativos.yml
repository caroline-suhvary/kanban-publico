name: Limpeza Diaria de Inativos

on:
  schedule:
    # Executa todos os dias às 03:00 UTC (00:00 horário de Brasília)
    - cron: "0 3 * * *"
  # Permite disparar o teste manualmente quando você quiser
  workflow_dispatch:

jobs:
  executar-limpeza:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rotina de limpeza no Supabase
        run: |
          RESPOSTA=$(curl -s -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/limpar_inativos" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json")

          echo "Retorno do Supabase: $RESPOSTA"
